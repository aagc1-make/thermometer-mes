app:
  name: MES 连通性预检
  description: 仅用于部署预检：验证 MES → Dify 的 API 调用和 Dify → MES 的回调链路。不参与验收，完整编排见 mes-ai-workflow.yml。
  icon: "🔌"
  icon_background: "#F2F4F7"
  mode: workflow
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.3.0
workflow:
  conversation_variables: []
  environment_variables:
    - description: Dify 可以访问的 MES 回调完整地址，路径为 /mes/ai/dify/callback。
      id: 14f340c6-6171-4fa9-8778-5b10808752a7
      name: mes_callback_url
      selector: [env, mes_callback_url]
      value: ""
      value_type: string
  features:
    file_upload:
      enabled: false
    opening_statement: ""
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ""
      voice: ""
  graph:
    edges:
      - id: n_start-source-n_rewrite-target
        data: { isInIteration: false, sourceType: start, targetType: http-request }
        source: n_start
        sourceHandle: source
        target: n_rewrite
        targetHandle: target
        type: custom
        zIndex: 0
      - id: n_rewrite-source-n_end-target
        data: { isInIteration: false, sourceType: http-request, targetType: end }
        source: n_rewrite
        sourceHandle: source
        target: n_end
        targetHandle: target
        type: custom
        zIndex: 0
    nodes:
      - id: n_start
        type: custom
        width: 244
        height: 116
        position: { x: 64, y: 200 }
        positionAbsolute: { x: 64, y: 200 }
        sourcePosition: right
        targetPosition: left
        data:
          type: start
          title: 领取本轮任务
          desc: 接收 MES 签发的一次性凭证。
          selected: false
          variables:
            - variable: ticket
              label: 一次性运行凭证
              type: text-input
              required: true
              max_length: 64
              options: []
            - variable: route
              label: 检索分支
              type: select
              required: false
              max_length: 16
              options: [doc, graph, business, mixed]
      - id: n_rewrite
        type: custom
        width: 244
        height: 124
        position: { x: 388, y: 200 }
        positionAbsolute: { x: 388, y: 200 }
        sourcePosition: right
        targetPosition: left
        data:
          type: http-request
          title: 问题改写确认
          desc: 只验证回调可达与阶段凭证被接受；完整阶段链见 mes-ai-workflow.yml。
          selected: false
          method: post
          url: "{{#env.mes_callback_url#}}"
          authorization:
            type: no-auth
            config: null
          headers: "Content-Type:application/json"
          params: ""
          body:
            type: json
            data:
              - id: body-rewrite
                key: ""
                type: text
                value: '{"stage":"rewrite","ticket":"{{#n_start.ticket#}}"}'
          retry_config:
            retry_enabled: false
            max_retries: 1
            retry_interval: 100
      - id: n_end
        type: custom
        width: 244
        height: 112
        position: { x: 715, y: 200 }
        positionAbsolute: { x: 715, y: 200 }
        sourcePosition: right
        targetPosition: left
        data:
          type: end
          title: 返回预检回执
          desc: 预检只回传末步状态码；MES 不认领本轮编排，仍走既有问答。
          selected: false
          outputs:
            - variable: callback_status
              value_selector: [n_rewrite, status_code]
            - variable: next_ticket
              value_selector: [n_rewrite, body]
    viewport: { x: 0, y: 0, zoom: 0.9 }
