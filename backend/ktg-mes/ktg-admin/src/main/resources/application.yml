# 项目相关配置
ktg-mes:
  # 名称
  name: ktg
  # 版本
  version: 3.8.2
  # 版权年份
  copyrightYear: 2022
  # 实例演示开关
  demoEnabled: true
  # 文件路径 示例（ Windows配置D:/ktg/uploadPath，Linux配置 /home/ktg/uploadPath）
  profile: ./upload
  #profile: /home/www/uploadPath
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数组计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.ktg: debug
    org.springframework: warn

# Spring配置
spring:
  rabbitmq:
    enabled: false # 是否启用RabbitMQ
    host: localhost # RabbitMQ 服务的地址
    port: 5672 # RabbitMQ 服务的端口
    username: mes # RabbitMQ 服务的账号
    password: mes # RabbitMQ 服务的密码
    virtual-host: / # 默认虚拟主机
    consumer:
      batchSize: 100 # 消费者每次拉取消息的数量
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
     multipart:
       # 单个文件大小
       max-file-size:  10MB
       # 设置总上传的文件大小
       max-request-size:  20MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  # redis 配置
  redis:
    # 地址（用 127.0.0.1：localhost 会先解析到 IPv6 的 ::1，而 Redis 只监听 IPv4 时会连不上）
    host: 127.0.0.1
    # 端口，默认为6379
    port: 6379
    # 数据库索引
    database: 0
    # 密码（本机 E:\dev\redis 未设置 requirepass，空的密码项才不会发送 AUTH；
    # 若 Redis 配了 requirepass 123456，请取消下一行注释并删除本行说明）
    # password: 123456
    # 连接超时时间
    timeout: 10s
    lettuce:
      pool:
        # 连接池中的最小空闲连接
        min-idle: 0
        # 连接池中的最大空闲连接
        max-idle: 8
        # 连接池的最大数据库连接数
        max-active: 8
        # #连接池最大阻塞等待时间（使用负值表示没有限制）
        max-wait: -1ms

# token配置
token:
    # 令牌自定义标识
    header: Authorization
    # 令牌密钥
    secret: abcdefghijklmnopqrstuvwxyz
    # 令牌有效期（默认30分钟）
    expireTime: 30

# MyBatis配置
mybatis:
    # 搜索指定包别名
    typeAliasesPackage: com.ktg.**.domain
    # 配置mapper的扫描，找到所有的mapper.xml映射文件
    mapperLocations: classpath*:mapper/**/*Mapper.xml
    # 加载全局的配置文件
    configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Swagger配置
swagger:
  # 是否开启swagger
  enabled: true
  # 请求前缀
  #pathMapping: /prod-api
  pathMapping: /dev-api

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

#Mino配置
minio:
  url: http://127.0.0.1:9100
  accessKey: minioadmin
  secretKey: minioadmin
  bucketName: lx-mes

# ==================== MES 智能助手（D3 智能体） ====================
# 密钥全部由环境变量注入，配置文件中不含明文：
#   MES_AI_KEY     DeepSeek 主模型（意图识别，质量优先）
#   MES_AI_FB_KEY  智谱 GLM-4-Flash 兜底（免费，主模型失败时切换）
mes:
  ai:
    deepseek-key: ${MES_AI_KEY:}
    deepseek-url: https://api.deepseek.com/v1/chat/completions
    deepseek-model: deepseek-chat
    glm-key: ${MES_AI_FB_KEY:}
    glm-url: https://open.bigmodel.cn/api/paas/v4/chat/completions
    glm-model: glm-4-flash
    timeout-ms: 8000
